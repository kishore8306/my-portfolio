<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | Kishore A</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav>
    <div class="logo">Kishore<span> Tech</span></div>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="skills.html">Expertise</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html" class="contact-btn active">Hire Me</a></li>
    </ul>
</nav>

<div class="contact-container">
    <h3 class="section-title">Get In Touch</h3>

    <form class="contact-form">
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <textarea rows="5" placeholder="Message"></textarea>
        <button type="submit" class="submit-btn">Send Message</button>
    </form>
</div>

<footer class="social-footer">
    <a href="https://www.linkedin.com/" target="_blank">
        <img src="linkedin.jpg">
    </a>
    <a href="mailto:yourmail@gmail.com">
        <img src="gmail.jpg">
    </a>
    <a href="https://github.com/kishore8306" target="_blank">
        <img src="github.jpg">
    </a>
</footer>

<div id="snow-container"></div>
<script src="snow.js"></script>


<script>
document.querySelector(".contact-form").addEventListener("submit", async function(e) {
    e.preventDefault();

    const name = this.querySelector("input[type='text']").value;
    const email = this.querySelector("input[type='email']").value;
    const message = this.querySelector("textarea").value;

    const res = await fetch("http://localhost:5000/api/contact", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ name, email, message })
    });

    const data = await res.json();

    if (data.success) {
        alert("Message sent successfully!");
        this.reset();
    } else {
        alert("Something went wrong");
    }
});
</script>



</body>
</html>
